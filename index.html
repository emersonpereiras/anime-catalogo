<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime App</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#121212;
    color:white;
    font-family:Arial,sans-serif;
}

h1{
    text-align:center;
}

#busca{
    width:100%;
    max-width:500px;
    display:block;
    margin:20px auto;
    padding:12px;
    border-radius:8px;
    border:none;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
}

.card h3{
    margin:10px;
}

.card p{
    margin:10px;
    color:#aaa;
}

#detalhes{
    display:none;
}

.ep{
    display:block;
    margin:8px 0;
    padding:10px;
    background:#0088cc;
    color:white;
    text-decoration:none;
    border-radius:6px;
}

button{
    padding:10px 15px;
    border:none;
    background:#444;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

</style>
</head>
<body>

<h1>📺 Anime App</h1>

<input
id="busca"
placeholder="Pesquisar Anime..."
>

<div id="lista" class="grid"></div>

<div id="detalhes"></div>

<script>

let catalogo=[];

fetch('catalogo.json')
.then(r=>r.json())
.then(data=>{

catalogo=data;

renderizar(data);

});

function renderizar(lista){

const container=document.getElementById("lista");

container.innerHTML='';

lista.forEach(anime=>{

container.innerHTML+=`

<div class="card"
onclick="abrirAnime('${anime.tag}')">

<img src="${anime.capa}">

<h3>${anime.nome}</h3>

<p>${anime.status}</p>

</div>

`;

});

}

function abrirAnime(tag){

const anime=catalogo.find(a=>a.tag===tag);

document.getElementById("lista").style.display="none";

const detalhes=document.getElementById("detalhes");

detalhes.style.display="block";

let html=`

<button onclick="voltar()">
⬅ Voltar
</button>

<h2>${anime.nome}</h2>

<img
src="${anime.capa}"
style="width:250px;border-radius:10px;"
>

<p>${anime.sinopse}</p>

<h3>Episódios</h3>

`;

anime.episodios.forEach(ep=>{

html+=`

<a
class="ep"
href="${ep.link}"
target="_blank"
>
▶ Episódio ${ep.numero}
</a>

`;

});

detalhes.innerHTML=html;

}

function voltar(){

document.getElementById("detalhes").style.display="none";

document.getElementById("lista").style.display="grid";

}

document
.getElementById("busca")
.addEventListener("input",e=>{

let termo=e.target.value.toLowerCase();

let resultado=catalogo.filter(anime=>
anime.nome.toLowerCase().includes(termo)
);

renderizar(resultado);

});

</script>

</body>
</html>
